<div id='dis' hidden>
  <div class='dh'>
    <h3>Diseñador</h3><span class='sub' id='dNombre'></span><button class='ib' id='dOtro' title='Abrir otro formato'>Abrir…</button>
    <div class='seg' id='dModos'><button data-m='diseno' class='on'>Diseño</button><button data-m='codigo'>Código</button><button data-m='final'>Vista final</button></div>
    <button class='ib' id='dUndo' title='Deshacer (Ctrl+Z)'>↶</button><button class='ib' id='dRedo' title='Rehacer (Ctrl+Y)'>↷</button>
    <select id='dZoom' title='Zoom'><option value='0.6'>60%</option><option value='0.75' selected>75%</option><option value='0.9'>90%</option><option value='1'>100%</option><option value='1.25'>125%</option></select>
    <span class='esp'></span>
    <select id='dDoc' title='Documento con el que se prueba el diseño'></select>
    <span class='estado' id='dEstado'>Guardado</span>
    <button class='ib p' id='dGuardar'>Guardar (Ctrl+S)</button>
    <button class='ib' id='dCerrar'>Cerrar</button>
  </div>
  <div class='aviso' id='dAviso' hidden></div>
  <div class='cuerpo'>
    <aside class='lado' id='dIzq'>
      <div class='ptabs' id='dIzqTabs'><button data-p='campos' class='on'>Campos</button><button data-p='elementos'>Elementos</button><button data-p='documento'>Documento</button></div>
      <div class='pbody' id='dIzqCuerpo'></div>
    </aside>
    <section class='centro'>
      <div id='dMigas'></div>
      <div id='dLienzo'><iframe id='dFrame'></iframe><div class='carga' id='dCarga' hidden>Preparando el diseño…</div></div>
      <div id='dCodigo' hidden><textarea id='dTexto' spellcheck='false'></textarea></div>
      <div id='dFinal' hidden><iframe id='dFinalFrame' style='flex:1'></iframe><div id='dFaltan' hidden></div></div>
    </section>
    <aside class='lado' id='dDer'>
      <div class='ptabs'><button class='on' style='cursor:default'>Propiedades</button></div>
      <div class='pbody' id='dDerCuerpo'></div>
    </aside>
  </div>
</div>
<div id='dModal' hidden></div>
